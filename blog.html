     <h1>Contact me</h1>

        <form action="https://wp.zybooks.com/form-viewer.php" method="POST">
              
          <p>
            <label for="firstname">First Name:</label>
            <input type="text" name="first" id="first">
          </p>
          <p>
            <label for="lastname">Last Name:</label>
            <input type="text" name="last" id="last">
          </p>
          <p>
            <label for="companyname">Company Name:</label>
            <input type="text" name="Company" id="Company">
          </p>

          <p>
            <label for="email">Email Address:</label>
            <small><small><small>ex.andy123@mail.com</small></small></small>
            <input type="email" name="email" id="email" >
          </p>

          <p>
            <label for="phone">Phone Number:</label>
            <small><small><small>ex.123-456-6789</a></small></small></small>
            <input type="tel" name="phone" id="phone" pattern="[0-9]{3}-[0-9 {3}-[0-9]{4}" >
          </p>

          <p>
            <label for="message">Message:</label>
            <textarea id="text" name="message" rows="15"></textarea>

          </p>

          <p>
            <label for="time">Best contact Time:</label>
            <br>
            <label for="a.m.">a.m.</label>
            <input type="radio" name="p.m." value="1" id="a.m.">
            <br>
            <label for="p.m.">p.m.</label>
            <input type="radio" name="p.m." value="2" id="p.m.">
            <br>
            <label for="anytime.">anytime</label>
            <input type="radio" name="anytime." value="3" id="anytime.">

            
          </p>

          

         

          <select name="Contact Type">
            <option value="phone">Phone</option>
            <option value="email">Email</option>
            <option value="text">Text</option>
          </select>
         

          <input type="submit">
          
        </form>
